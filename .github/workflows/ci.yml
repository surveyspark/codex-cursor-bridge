name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate:manifests
      - run: npm test
      - name: Bundle smoke test
        shell: bash
        run: |
          out=$(node bundles/codex-cursor-bridge.mjs --version)
          echo "$out"
          echo "$out" | grep -E '[0-9]+\.[0-9]+\.[0-9]+'
      - name: Demos (fake agents)
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.invalid
          git add -A || true
          git commit -qm ci || echo "nothing to commit (ok)"
          mkdir -p .handoff
          node bundles/codex-cursor-bridge.mjs demos run delegate-investigate
          node bundles/codex-cursor-bridge.mjs demos run plan-and-execute
          node bundles/codex-cursor-bridge.mjs demos run recursion-blocked
          node bundles/codex-cursor-bridge.mjs demos run cancel-kills-tree

  package-validation:
    name: package validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update -y && sudo apt-get install -y zip
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - name: Verify checksums
        run: cd release && shasum -a 256 -c SHA256SUMS
      - name: Archive smoke test (install + doctor)
        run: |
          cd release && unzip -q codex-cursor-bridge-cli-*.zip -d smoke
          node smoke/codex-cursor-bridge/codex-cursor-bridge.mjs --version
          node smoke/codex-cursor-bridge/codex-cursor-bridge.mjs doctor --json > /dev/null && echo "doctor json ok (exit $? tolerated)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/
          retention-days: 7
